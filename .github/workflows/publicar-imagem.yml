# Testa e gera a imagem no GHCR. Publica SÓ em tag de versão vX.Y.Z (criada num commit que já
# está na main): :vX.Y.Z e :sha-<commit>. Em PR, roda só os testes. Mesmo desenho do omie-mcp.
# A VPS instala só a versão fixada em /etc/esteira/versoes.conf (etiqueta + digest).
name: Publicar imagem

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

jobs:
  testes:
    runs-on: [self-hosted, linux, preprod]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.15"
      - run: python -m pip install -q --require-hashes --no-deps -r requirements-dev.lock
      - run: python -m pytest -q

  imagem:
    needs: testes
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, preprod]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Versão só sai de commit que está na main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::A tag $GITHUB_REF_NAME aponta para $GITHUB_SHA, que não está na main."
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: true
          pull: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.oryonntech.esteira.modo=padrao
          tags: |
            ghcr.io/oryonntech/firecrawl-mcp:${{ github.ref_name }}
            ghcr.io/oryonntech/firecrawl-mcp:sha-${{ github.sha }}
      - name: Digest no resumo da execução (vai no versoes.conf)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/oryonntech/firecrawl-mcp:$GITHUB_REF_NAME@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
