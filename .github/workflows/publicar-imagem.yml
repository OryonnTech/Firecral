# Testa e gera a imagem no GHCR. Publica SÓ em tag de versão vX.Y.Z (criada num commit que já
# está na main): :vX.Y.Z e :sha-<commit>. Em PR, roda só os testes. Mesmo desenho do omie-mcp.
# A VPS instala só a versão fixada em /etc/esteira/versoes.conf (etiqueta + digest).
name: Publicar imagem

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

jobs:
  segredos:
    # Varredura de segredos (gitleaks 8.30.1, versão e SHA-256 fixos) antes de gerar a
    # versão: se achar segredo no histórico, nada é montado nem publicado.
    # Falso positivo: "Fingerprint" do achado no .gitleaksignore, com OK do dono.
    # Só na tag de versão, como o job que publica.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, preprod]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Instalar gitleaks v8.30.1 (checksum fixo)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Varrer o histórico (segredos mascarados no log)
        run: ./gitleaks git . --redact --verbose --no-banner

  testes:
    runs-on: [self-hosted, linux, preprod]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.15"
      - run: python -m pip install -q --require-hashes --no-deps -r requirements-dev.lock
      - run: python -m pytest -q

  imagem:
    needs: [testes, segredos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, preprod]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Versão só sai de commit que está na main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::A tag $GITHUB_REF_NAME aponta para $GITHUB_SHA, que não está na main."
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: true
          pull: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.oryonntech.esteira.modo=padrao
          tags: |
            ghcr.io/oryonntech/firecrawl-mcp:${{ github.ref_name }}
            ghcr.io/oryonntech/firecrawl-mcp:sha-${{ github.sha }}
      - name: Digest no resumo da execução (vai no versoes.conf)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/oryonntech/firecrawl-mcp:$GITHUB_REF_NAME@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
